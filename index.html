<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <title>Training &amp; Meal Planner</title>
    <!--
      Resolve the theme before first paint to avoid a flash. Mirrors
      ThemeProvider: localStorage 'theme' is 'light' | 'dark' | 'system' (or
      unset = system); apply the matching class to <html>. Fonts are self-hosted
      via @fontsource and the icon subset — both imported in src/main.tsx.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
